{% extends "base.html" %}

{% block descrizione %}

<div class="register-container">

    <!-- MODIFICATO: action ora punta a 'login' e rimosso enctype -->
    <form class="register-form"
          method="POST"
          action="{{ url_for('login') }}">

        <h2>Login Utente</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for msg in messages %}
            <p style="color: #d40000; display: flex; justify-content: center; align-items: center;">{{ msg }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text"
                   name="username"
                   id="username"
                   required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password"
                   name="password"
                   id="password"
                   required>
        </div>

        <button type="submit" class="register-btn">Accedi</button>

    </form>

</div>

{% endblock %}
